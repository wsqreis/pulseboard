services:
  api:
    image: python:3.12-slim
    working_dir: /app/apps/api
    command: >-
      bash -lc "pip install -e .[dev] && pytest tests && ruff check . && mypy app tests"
    environment:
      PULSEBOARD_DATABASE_URL: postgresql+psycopg://pulseboard:pulseboard@db:5432/pulseboard
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseboard
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: pulseboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
