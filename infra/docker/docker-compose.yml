services:
  api:
    image: python:3.12-slim
    working_dir: /workspace/apps/api
    command: >-
      bash -lc "pip install -e .[dev] && python scripts/seed_demo.py && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      PULSEBOARD_DATABASE_URL: postgresql+psycopg://pulseboard:pulseboard@db:5432/pulseboard
      PULSEBOARD_APP_BASE_URL: http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ../..:/workspace
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:24-bullseye
    working_dir: /workspace
    command: >-
      bash -lc "npm install && npm run generate:contracts && cd apps/web && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ../..:/workspace
    depends_on:
      api:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseboard
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: pulseboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
